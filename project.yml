
name: AutoClickerVIP

options:
  bundleIdPrefix: com.xuanvumai
  deploymentTarget:
    iOS: "16.0"

targets:
  AutoClickerVIP:
    type: application
    platform: iOS

    sources:
      - path: AutoClickerVIP

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuanvumai.autoclickervip
        PRODUCT_NAME: AutoClickerVIP
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AutoClick VIP
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
