
name: AutoClickerVIP

options:
  bundleIdPrefix: com.autoclickervip
  deploymentTarget:
    iOS: "16.0"

targets:
  AutoClickerVIP:
    type: application
    platform: iOS

    sources:
      - AutoClickerVIP

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autoclickervip.ios
        PRODUCT_NAME: AutoClickerVIP
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Auto Clicker VIP
        INFOPLIST_KEY_LSApplicationQueriesSchemes:
          - snssdk1233
          - fb
          - youtube
          - instagram
