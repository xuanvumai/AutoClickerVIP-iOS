
name: Xay dung AutoClick VIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: autoclickervip-build
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra file
        run: |
          test -f project.yml
          test -f AutoClickerVIP/AutoClickerVIPApp.swift
          test -f AutoClickerVIP/ContentView.swift

      - name: Kiem tra Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Cai XcodeGen
        run: |
          brew install xcodegen

      - name: Tao project Xcode
        run: |
          xcodegen generate
          test -d AutoClickerVIP.xcodeproj

      - name: Kiem tra scheme
        run: |
          xcodebuild \
            -list \
            -project AutoClickerVIP.xcodeproj

      - name: Build iOS
        run: |
          xcodebuild \
            -project AutoClickerVIP.xcodeproj \
            -scheme AutoClickerVIP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Dong goi IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/AutoClickerVIP.app"

          test -d "$APP"

          mkdir -p Payload

          ditto "$APP" Payload/AutoClickerVIP.app

          zip -qry AutoClickerVIP.ipa Payload

          test -s AutoClickerVIP.ipa

      - name: Tai len IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickerVIP-IPA
          path: AutoClickerVIP.ipa
          if-no-files-found: error
          retention-days: 7
