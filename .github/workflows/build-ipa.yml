
name: AutoClick VIP iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build application
        run: |
          xcodebuild \
            -project AutoClickerVIP.xcodeproj \
            -scheme AutoClickerVIP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AutoClickerVIP.app Payload/
          /usr/bin/zip -r AutoClickVIP.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickVIP-iOS
          path: AutoClickVIP.ipa
          if-no-files-found: error
          retention-days: 7
