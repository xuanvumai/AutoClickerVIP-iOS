
name: AutoClickerVIP iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: autoclickervip-build
  cancel-in-progress: true

jobs:
  build:
    name: Build AutoClick VIP
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check Swift files
        run: |
          test -f project.yml
          test -f AutoClickerVIP/AutoClickerVIPApp.swift
          test -f AutoClickerVIP/ContentView.swift

      - name: Check Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AutoClickerVIP.xcodeproj \
            -scheme AutoClickerVIP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/AutoClickerVIP.app"

          test -d "$APP"

          mkdir -p Payload
          ditto "$APP" Payload/AutoClickerVIP.app

          zip -qry AutoClickerVIP.ipa Payload

          test -s AutoClickerVIP.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AutoClickerVIP-IPA
          path: AutoClickerVIP.ipa
          if-no-files-found: error
          retention-days: 7
