
name: AutoClickerVIP iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AutoClickerVIP.xcodeproj \
            -scheme AutoClickerVIP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AutoClickerVIP.app Payload/
          zip -r AutoClickVIP.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: AutoClickVIP-iOS
          path: AutoClickVIP.ipa
          if-no-files-found: error
